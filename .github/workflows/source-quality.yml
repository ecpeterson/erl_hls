name: Source quality
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Retain bounded diagnostics even when tests pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.0.2'
          rebar3-version: '3.24.0'
      - name: Cache Dialyzer tables
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            _build/default/*plt
            ~/.cache/rebar3/*plt
          key: dialyzer-${{ runner.os }}-${{ runner.arch }}-28.0.2-${{ hashFiles('rebar.lock', '**/rebar.config') }}
      - name: Run shared source-quality checks
        env:
          SOURCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=()
          if [[ -n "$SOURCE_BASE" && "$SOURCE_BASE" != 0000000000000000000000000000000000000000 ]]; then
            base=(--base "$SOURCE_BASE")
          fi
          python3 tools/check.py --group quality --stage _build/checks/ci "${base[@]}"
      - name: Retain bounded source-contract diagnostics
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.diagnostics == true)
        uses: ./.github/actions/diagnostics
        with:
          name: source-contracts
          paths: |
            _build/source-contracts.json
            _build/checks/**
