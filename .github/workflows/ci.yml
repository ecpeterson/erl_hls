name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XLS_VERSION: v0.0.0-10601-g9f360fc89
  XLS_SHA256: 163c27ee1a606b77956e0e2317a5b0ce98390d65b74ab12471356ddb679a835e

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Erlang and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.0.2"
          rebar3-version: "3.24.0"

      - name: Install RTL verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys

      - name: Cache XLS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/xls
          key: xls-${{ runner.os }}-${{ runner.arch }}-${{ env.XLS_VERSION }}-${{ env.XLS_SHA256 }}

      - name: Install pinned XLS release
        env:
          XLS_ROOT: ${{ runner.temp }}/xls
        run: |
          if [[ ! -x "$XLS_ROOT/codegen_main" ]]; then
            archive="$RUNNER_TEMP/xls.tar.gz"
            url="https://github.com/google/xls/releases/download/$XLS_VERSION/xls-$XLS_VERSION-linux-x64.tar.gz"
            curl --fail --location --show-error "$url" --output "$archive"
            echo "$XLS_SHA256  $archive" | sha256sum --check
            mkdir -p "$XLS_ROOT"
            tar -xzf "$archive" --strip-components=1 -C "$XLS_ROOT"
          fi
          "$XLS_ROOT/codegen_main" --version

      - name: Run Erlang tests
        run: rebar3 eunit

      - name: Check differential compiler runner and shrinking
        run: |
          python3 tools/test_compiler_differential.py
          python3 tools/test_compiler_differential.py --xls-root "$RUNNER_TEMP/xls"

      - name: Compare generated Erlang functions with DSLX, JIT, and RTL
        run: |
          python3 tools/compiler_differential.py "$RUNNER_TEMP/xls" \
            --count 16 --depth 3 --inputs 20 --rtl-batches 2 --shrink-budget 40

      - name: Compare macro-configured actors with BEAM
        run: bash tools/test_source_context.sh "$RUNNER_TEMP/xls"

      - name: Fault-inject the VPI transport
        run: python3 tools/test_sim_bridge.py

      - name: Check topology query protocol and discovery
        run: |
          python3 tools/test_topology_debug.py
          python3 tools/test_direct_actor_debug.py

      - name: Check bounded actor snapshot equivalence
        run: python3 tools/test_actor_snapshot_formal.py

      - name: Check incremental compilation, failure recovery, and regsvc RTL identity
        run: python3 tools/test_compile_xls.py --xls-root "$RUNNER_TEMP/xls"

      - name: Check physical timing reports and artifact provenance
        run: python3 experiments/07-openxc7/test_phi_timing.py

      - name: Check effect-window handshakes and combinational loops
        run: bash tools/test_effect_window.sh "$RUNNER_TEMP/xls"

      - name: Prove round-robin selection and grant fairness
        run: python3 tools/test_arbitration.py "$RUNNER_TEMP/xls"

      - name: Compare entry outcomes with BEAM and simulate RTL
        run: bash tools/test_entry_outcomes.sh "$RUNNER_TEMP/xls"

      - name: Compare control-flow failures with BEAM and routed RTL
        run: bash tools/test_control_failures.sh "$RUNNER_TEMP/xls"

      - name: Check service reply contracts under backpressure
        run: bash tools/test_service_contracts.sh "$RUNNER_TEMP/xls"

      - name: Compare fixed bit syntax and diagnose packed samples through public debug APIs
        run: bash tools/test_binary.sh "$RUNNER_TEMP/xls"

      - name: Compare dense and padded codecs with BEAM and RTL
        run: bash tools/test_logical_types.sh "$RUNNER_TEMP/xls"

      - name: Compare typed floats with BEAM, JIT, and routed RTL
        run: bash tools/test_float_arithmetic.sh "$RUNNER_TEMP/xls"

      - name: Compare integer division and remainder with BEAM, JIT, and RTL
        run: bash tools/test_integer_arithmetic.sh "$RUNNER_TEMP/xls"

      - name: Compare signed and mixed-width shifts with BEAM, JIT, and RTL
        run: bash tools/test_integer_shifts.sh "$RUNNER_TEMP/xls"

      - name: Compare checked collections with BEAM, JIT, and RTL
        run: bash tools/test_collections.sh "$RUNNER_TEMP/xls"

      - name: Compare bounded patterns and guarded helpers with BEAM, JIT, and RTL
        run: bash tools/test_patterns.sh "$RUNNER_TEMP/xls"

      - name: Check source type shapes and destructured reduction transport
        run: bash tools/test_type_shapes.sh "$RUNNER_TEMP/xls"

      - name: Check actor namespaces and mixed-case record codecs
        run: bash tools/test_names.sh "$RUNNER_TEMP/xls"

      - name: Check configurable routed streams and prove packet conservation
        run: python3 tools/test_fabric_router.py

      - name: Check application framing and admission conservation
        run: bash tools/test_application_frames.sh "$RUNNER_TEMP/xls"

      - name: Check direct actor admission, self-delivery, and credit conservation
        run: bash tools/test_direct_admission.sh "$RUNNER_TEMP/xls"

      - name: Inspect admitted receive backpressure through the debug endpoint
        run: |
          python3 tools/test_topology_debug_integration.py \
            --top application_frames --stage _build/application_frames/debug \
            _build/application_frames/DebugTop-p2-ii1.v

      - name: Compare typed helpers with BEAM and inline RTL
        run: bash tools/test_helpers.sh "$RUNNER_TEMP/xls"

      - name: Check initialization and reset against BEAM
        run: bash tools/test_initialization.sh "$RUNNER_TEMP/xls"

      - name: Inspect startup backpressure through the debug endpoint
        run: |
          python3 tools/test_topology_debug_integration.py \
            --top init_shared_wrapper --stage _build/initialization/debug \
            _build/initialization/init_shared_2.v \
            _build/initialization/init_shared_wrapper.v priv/rtl/hls_1r1w_ram.v

      - name: Diagnose shared actor failures through scoped debug queries
        run: bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls"

      - name: Inspect postponed mailboxes and recovery through scoped debug queries
        run: |
          bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls" _build/mailbox-debug mailbox
          bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls" _build/direct-mailbox-debug direct_mailbox
          bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls" _build/mixed-mailbox-debug mailbox_mixed

      - name: Diagnose reduction failures through scoped debug queries
        run: |
          bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls" _build/reduction-debug reduction
          bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls" _build/direct-actor-debug direct_reduction
          bash tools/test_direct_actor_codegen.sh "$RUNNER_TEMP/xls"
          bash tools/test_actor_debug.sh "$RUNNER_TEMP/xls" _build/aggregate-debug aggregate

      - name: Run generated reduction semantics
        run: bash tools/test_reduction_dslx.sh "$RUNNER_TEMP/xls"

      - name: Run specialized phi RTL regressions
        run: |
          experiments/08-phi-scheduler/run_raw_rtl.sh
          experiments/08-phi-scheduler/run_relax_bank.sh

      - name: Prepare simulation inputs
        run: bash tools/prepare_xls_sim.sh "$PWD/_build/xls_sim/regsvc"

      - name: Run generated RTL and bridged EUnit regressions
        env:
          XLS_ROOT: ${{ runner.temp }}/xls
        run: bash tools/remote_xls_sim.sh "$PWD/_build/xls_sim/regsvc" "$XLS_ROOT"

      - name: Exercise configurable local services and public stall diagnostics
        run: python3 tools/test_fabric_services.py _build/xls_sim/regsvc

      - name: Diagnose dropped observations through the debug endpoint
        run: python3 tools/test_debug_trace_integration.py _build/xls_sim/regsvc

      - name: Upload decoded debug observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-observation-reports
          path: |
            _build/frame-router/**/*.log
            _build/frame-router/**/*.vcd
            _build/fabric-services/*.log
            _build/fabric-services/*.term
            _build/debug-trace-integration/*.log
            _build/debug-trace-integration/trace_*.term
            _build/actor-debug/**/actors-*.term
            _build/actor-debug/**/manifest.json
            _build/actor-debug/**/blocked.txt
            _build/actor-debug/**/recovered.txt
            _build/mailbox-debug/**/actors-*.term
            _build/mailbox-debug/**/manifest.json
            _build/mailbox-debug/**/blocked.txt
            _build/mailbox-debug/**/recovered.txt
            _build/reduction-debug/**/actors-*.term
            _build/reduction-debug/**/scc.log
            _build/aggregate-debug/**/actors-*.term
            _build/aggregate-debug/**/scc.log
          if-no-files-found: ignore

      - name: Query an instrumented generated topology under backpressure
        run: |
          python3 tools/test_topology_debug_integration.py \
            --top __ordered_egress_topology__Top_0_next \
            --stage _build/topology-debug-queries/ordered \
            _build/xls_sim/regsvc/ordered_egress_topology.v

      - name: Verify checked generated artifacts
        run: bash tools/xls_goldens.sh check "$PWD/_build/xls_sim/regsvc"

      - name: Upload simulation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xls-simulation-diagnostics
          path: |
            _build/topology-debug-queries/**/*.log
            _build/topology-debug-queries/**/manifest.json
            _build/topology-debug-queries/**/blocked.json
            _build/topology-debug-queries/**/recovered.json
            _build/sim_bridge/**/*.log
            _build/sim_bridge/**/*.sv
            _build/effect_window/*.ir
            _build/effect_window/*.v
            _build/effect_window/*.ys
            _build/effect_window/*.log
            _build/effect_window/*.console
            _build/service_contracts/*.log
            _build/service_contracts/*.json
            _build/service_contracts/**/*.v
            _build/service_contracts/**/*.x
            _build/binary/**/*.log
            _build/binary/live/*.term
            _build/binary/*.x
            _build/binary/*.v
            _build/logical-types/*.x
            _build/logical-types/*.mem
            _build/logical-types/**/*.v
            _build/entry_outcomes/*.x
            _build/entry_outcomes/*.ir
            _build/entry_outcomes/*.v
            _build/entry_outcomes/*.sv
            _build/application_frames/**
            _build/direct-admission-tests/**
            _build/initialization/**
            _build/actor-debug/**
            _build/actor-snapshot-formal/**
            _build/arbitration/**
            _build/mailbox-debug/**
            _build/direct-mailbox-debug/**
            _build/mixed-mailbox-debug/**
            _build/reduction-debug/**
            _build/aggregate-debug/**
            _build/reduction-semantics/**
            _build/helpers/**
            _build/control_failures/**
            _build/typed-float/**
            _build/integer-arithmetic/**
            _build/integer-shifts/**
            _build/collections/**
            _build/patterns/**
            _build/type-shapes/**
            _build/names/**
            _build/compiler-differential/**
            _build/differential-self-test/**
            _build/xls_sim/regsvc/*.ir
            _build/xls_sim/regsvc/*.v
            _build/xls_sim/regsvc/sim/vvp.log
            _build/xls_sim/regsvc/phi_sim/vvp.log
          if-no-files-found: ignore

  complete-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Erlang and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.0.2"
          rebar3-version: "3.24.0"

      - name: Install RTL verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys

      - name: Cache XLS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/xls
          key: xls-${{ runner.os }}-${{ runner.arch }}-${{ env.XLS_VERSION }}-${{ env.XLS_SHA256 }}

      - name: Install pinned XLS release
        env:
          XLS_ROOT: ${{ runner.temp }}/xls
        run: |
          if [[ ! -x "$XLS_ROOT/codegen_main" ]]; then
            archive="$RUNNER_TEMP/xls.tar.gz"
            url="https://github.com/google/xls/releases/download/$XLS_VERSION/xls-$XLS_VERSION-linux-x64.tar.gz"
            curl --fail --location --show-error "$url" --output "$archive"
            echo "$XLS_SHA256  $archive" | sha256sum --check
            mkdir -p "$XLS_ROOT"
            tar -xzf "$archive" --strip-components=1 -C "$XLS_ROOT"
          fi
          "$XLS_ROOT/codegen_main" --version

      - name: Check smaller and rectangular decoder profiles against BEAM
        run: python3 tools/test_decoder_profiles.py "$RUNNER_TEMP/xls" --cases board-sized rectangle-z --trace

      - name: Diagnose backpressure in the smaller profile through public debug queries
        run: |
          python3 tools/test_topology_debug_integration.py \
            --top phi_decoder_profile_top --clock aclk --reset aresetn --reset-active-low \
            --stage _build/decoder-profiles/board-sized/debug \
            _build/decoder-profiles/board-sized/compiled/phi_decoder_profile.v \
            _build/decoder-profiles/board-sized/compiled/phi_decoder_profile_top.v \
            _build/decoder-profiles/board-sized/compiled/hls_1r1w_ram.v

      - name: Build the complete D3 debug composition and production reference
        run: python3 tools/build_phi_debug.py "$RUNNER_TEMP/xls"

      - name: Diagnose D3 stalls while all debug services share one transport
        run: python3 tools/test_phi_debug.py _build/phi-debug

      - name: Upload full debug integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-debug-reports
          path: |
            _build/decoder-profiles/**/*.json
            _build/decoder-profiles/**/*.log
            _build/decoder-profiles/**/*.events
            _build/phi-debug/**/*.log
            _build/phi-debug/**/*.build.json
            _build/phi-debug/**/*.v
            _build/phi-debug/**/manifest.json
            _build/phi-debug/live/*.json
            _build/phi-debug/live/*.term

  mixed-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload: [closed, ingress]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Erlang and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.0.2"
          rebar3-version: "3.24.0"

      - name: Install RTL verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys

      - name: Cache XLS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/xls
          key: xls-${{ runner.os }}-${{ runner.arch }}-${{ env.XLS_VERSION }}-${{ env.XLS_SHA256 }}

      - name: Install pinned XLS release
        env:
          XLS_ROOT: ${{ runner.temp }}/xls
        run: |
          if [[ ! -x "$XLS_ROOT/codegen_main" ]]; then
            archive="$RUNNER_TEMP/xls.tar.gz"
            url="https://github.com/google/xls/releases/download/$XLS_VERSION/xls-$XLS_VERSION-linux-x64.tar.gz"
            curl --fail --location --show-error "$url" --output "$archive"
            echo "$XLS_SHA256  $archive" | sha256sum --check
            mkdir -p "$XLS_ROOT"
            tar -xzf "$archive" --strip-components=1 -C "$XLS_ROOT"
          fi
          "$XLS_ROOT/codegen_main" --version

      - name: Compare mixed direct/shared topologies with CPU and inspect stalls
        timeout-minutes: 5
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          placements=(direct one two coalesced)
          if [[ "$WORKLOAD" == ingress ]]; then
            placements=(ingress_direct ingress_one ingress_two ingress_coalesced)
          fi
          bash tools/test_mixed_topology.sh "$RUNNER_TEMP/xls" _build/mixed-topology "${placements[@]}"

      - name: Upload mixed topology diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mixed-topology-${{ matrix.workload }}-reports
          path: |
            _build/mixed-topology/**/*.log
            _build/mixed-topology/**/*.term
            _build/mixed-topology/**/*.hex
            _build/mixed-topology/**/*.x
            _build/mixed-topology/**/*.v
            _build/mixed-topology/**/manifest.json
            _build/mixed-topology/**/actors.json
            _build/mixed-topology/**/commands.json
            _build/mixed-topology/**/blocked.txt
            _build/mixed-topology/**/recovered.txt
          if-no-files-found: ignore
